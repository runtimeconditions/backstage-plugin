name: Build and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [., backend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish both packages and tag the release
        run: |
          version=$(scripts/next-version.sh)
          if [ -z "$version" ]; then
            echo "Nothing to release since the last tag"
            exit 0
          fi
          for dir in . backend; do
            name=$(npm pkg get name --prefix "$dir" | tr -d '"')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              continue
            fi
            (
              cd "$dir"
              npm ci
              npm run build
              npm pkg set version="$version" main=dist/index.js types=dist/index.d.ts
              npm publish
            )
          done
          git tag "v$version"
          git push origin "v$version"
          gh release create "v$version" --generate-notes --verify-tag
